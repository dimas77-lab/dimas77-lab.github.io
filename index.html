<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="icon" type="image/x-icon" href="#">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: white;
    }

    .container {
        text-align: center;
        animation: fadeIn 1.5s ease forwards;
        opacity: 0;
        z-index: 2;
    }

    h1 {
        font-size: 60px;
        letter-spacing: 4px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #00f5ff, #00ff9d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: glow 3s ease-in-out infinite alternate;
    }

    p {
        font-size: 18px;
        opacity: 0.85;
        max-width: 500px;
        margin: auto;
        line-height: 1.6;
    }

    .btn {
        margin-top: 30px;
        padding: 12px 28px;
        border: none;
        border-radius: 30px;
        background: #00f5ff;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .btn:hover {
        background: #00ff9d;
        transform: scale(1.05);
    }

    /* Background floating circles */
    .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        animation: float 15s infinite linear;
    }

    @keyframes float {
        from { transform: translateY(0) rotate(0deg); }
        to { transform: translateY(-1000px) rotate(360deg); }
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #00f5ff; }
        to { text-shadow: 0 0 20px #00ff9d; }
    }
    a.btn-link {
    display: inline-block;
    color: #fff;
    text-decoration: none;
    transition: all 0.3s ease;
    }

    a.btn-link:hover {
        transform: scale(1.05);
    }
</style>
</head>
<body>

<div class="container">
    <h1>COMING SOON</h1>
    <p>
        We're working hard to bring something amazing.  
        Stay tuned and get ready for a better experience.
    </p>
</div>

<script>
    // Create floating background circles
    function createCircle() {
        const circle = document.createElement("div");
        circle.classList.add("circle");

        let size = Math.random() * 100 + 20;
        circle.style.width = size + "px";
        circle.style.height = size + "px";
        circle.style.left = Math.random() * window.innerWidth + "px";
        circle.style.bottom = "-150px";
        circle.style.animationDuration = (Math.random() * 10 + 10) + "s";

        document.body.appendChild(circle);

        setTimeout(() => {
            circle.remove();
        }, 15000);
    }

    setInterval(createCircle, 800);
</script>

</body>
</html>
